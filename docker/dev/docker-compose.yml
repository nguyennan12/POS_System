services:
  postgres:
    image: postgres:17-alpine
    container_name: pos_postgres_dev
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pos_redis_dev
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  pos-api:
    build:
      context: ../..
      dockerfile: docker/dev/Dockerfile
    container_name: pos_api_dev
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
      ConnectionStrings__Default: "Host=postgres;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD}"
      Jwt__Secret: ${JWT_SECRET}
      Auth__PinLookupSecret: ${PIN_LOOKUP_SECRET}
      Jwt__Issuer: pos-api
      Jwt__Audience: pos-clients
      Serilog__LokiUrl: "${SERILOG_LOKI_URL}"
    labels:
      project: "pos-system"
    volumes:
      # Mount toàn bộ project từ máy host vào container
      - ../..:/app
      # Lưu cache nuget để không tải lại khi khởi động lại
      - nuget-data:/root/.nuget/packages
      # Anonymous volumes ngăn chặn xung đột file bin/obj giữa Windows host và Linux container
      - /app/src/POS.Api/bin
      - /app/src/POS.Api/obj
      - /app/src/POS.Application/bin
      - /app/src/POS.Application/obj
      - /app/src/POS.Domain/bin
      - /app/src/POS.Domain/obj
      - /app/src/POS.Infrastructure/bin
      - /app/src/POS.Infrastructure/obj
      - /app/src/POS.Contracts/bin
      - /app/src/POS.Contracts/obj
      - /app/tests/POS.Application.Tests/bin
      - /app/tests/POS.Application.Tests/obj
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  nuget-data: