services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      MSSQL_PID: "Developer"
    ports:
      - "14330:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\" -C || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  pos-api:
    build:
      context: ../..
      dockerfile: docker/dev/Dockerfile
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=${MSSQL_DB};User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD}"
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: pos-api
      Jwt__Audience: pos-clients
      Serilog__LokiUrl: "http://loki:3100"
    volumes:
      # Mount toàn bộ project từ máy host vào container
      - ../..:/app
      # Lưu cache nuget để không tải lại khi khởi động lại
      - nuget-data:/root/.nuget/packages
      # Anonymous volumes ngăn chặn xung đột file bin/obj giữa Windows host và Linux container
      - /app/src/POS.Api/bin
      - /app/src/POS.Api/obj
      - /app/src/POS.Application/bin
      - /app/src/POS.Application/obj
      - /app/src/POS.Domain/bin
      - /app/src/POS.Domain/obj
      - /app/src/POS.Infrastructure/bin
      - /app/src/POS.Infrastructure/obj
      - /app/src/POS.Contracts/bin
      - /app/src/POS.Contracts/obj
      - /app/tests/POS.Application.Tests/bin
      - /app/tests/POS.Application.Tests/obj
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy

  loki:
    image: grafana/loki:2.9.8
    ports: ["3100:3100"]
    volumes:
      - loki-data:/loki

  prometheus:
    image: prom/prometheus:v2.54.1
    ports: ["9090:9090"]
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:11.2.0
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on: [loki, prometheus]

volumes:
  sqlserver-data:
  redis-data:
  loki-data:
  prometheus-data:
  grafana-data:
  nuget-data:
